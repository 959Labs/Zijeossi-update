<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지저씨 - 2인 멀티플레이 프로토타입 테스트</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        header {
            margin-bottom: 12px;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            color: #38bdf8;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .status-bar {
            font-size: 13px;
            color: #94a3b8;
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 9999px;
            background: #1e293b;
            border: 1px solid #334155;
            font-weight: 600;
        }
        .badge.online {
            border-color: #22c55e;
            color: #4ade80;
        }
        .canvas-container {
            position: relative;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
            background: #090d16;
        }
        canvas {
            display: block;
        }
        .overlay-info {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
        }
        .log-box {
            position: absolute;
            bottom: 12px;
            left: 12px;
            width: 320px;
            max-height: 110px;
            overflow-y: auto;
            background: rgba(15, 23, 42, 0.85);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 11px;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .log-entry {
            line-height: 1.3;
        }
        .log-entry.connect { color: #4ade80; }
        .log-entry.disconnect { color: #f87171; }
        .guide-box {
            margin-top: 12px;
            font-size: 13px;
            color: #cbd5e1;
            background: #1e293b;
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .guide-box kbd {
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #475569;
            font-family: monospace;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 지저씨 멀티플레이 2인 동기화 프로토타입</h1>
        <div class="status-bar">
            <span class="badge" id="netStatus">🔴 연결 중...</span>
            <span class="badge">접속 인원: <strong id="playerCount" style="color:#fde047;">0</strong>명</span>
        </div>
    </header>

    <div class="canvas-container">
        <canvas id="testCanvas" width="800" height="550"></canvas>
        <div class="overlay-info" id="myCoord">내 좌표: (0, 0)</div>
        <div class="log-box" id="logBox">
            <div class="log-entry">서버 연결 대기 중...</div>
        </div>
    </div>

    <div class="guide-box">
        💡 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 또는 <kbd>방향키</kbd>로 캐릭터(점)를 움직여보세요! (창 2개를 띄우면 실시간 동기화됩니다)
    </div>

    <!-- Socket.io 클라이언트 라이브러리 자동 로드 -->
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');
        const netStatus = document.getElementById('netStatus');
        const playerCount = document.getElementById('playerCount');
        const myCoord = document.getElementById('myCoord');
        const logBox = document.getElementById('logBox');

        function addLog(msg, type = '') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerText = `[${time}] ${msg}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Socket.io 연결
        const socket = io();
        window.socket = socket;
        let myId = null;
        let players = {};
        window.players = players;
        const speed = 250; // 이동 속도 (픽셀/초)

        // 키 입력 감지
        const keys = {
            KeyW: false, KeyA: false, KeyS: false, KeyD: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false
        };
        window.keys = keys;

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
        });

        // 1. 서버 연결 성공
        socket.on('connect', () => {
            myId = socket.id;
            window.myId = myId;
            netStatus.className = 'badge online';
            netStatus.innerHTML = '🟢 온라인 (연결됨)';
            addLog(`서버에 접속했습니다! (내 ID: ${myId.slice(0, 6)})`, 'connect');
        });

        // 2. 서버 연결 끊김
        socket.on('disconnect', () => {
            netStatus.className = 'badge';
            netStatus.innerHTML = '🔴 연결 끊김';
            addLog('서버와 연결이 끊어졌습니다.', 'disconnect');
        });

        // 3. 기존 전체 플레이어 목록 수신
        socket.on('currentPlayers', (serverPlayers) => {
            players = serverPlayers;
            window.players = players;
            updatePlayerCount();
        });

        // 4. 새로운 플레이어 접속 수신
        socket.on('newPlayer', (playerInfo) => {
            players[playerInfo.id] = playerInfo;
            updatePlayerCount();
            addLog(`새 플레이어(${playerInfo.id.slice(0, 6)})가 접속했습니다.`, 'connect');
        });

        // 5. 다른 플레이어 이동 수신
        socket.on('playerMoved', (playerInfo) => {
            if (players[playerInfo.id]) {
                players[playerInfo.id].x = playerInfo.x;
                players[playerInfo.id].y = playerInfo.y;
            }
        });

        // 6. 플레이어 퇴장 수신
        socket.on('playerDisconnected', (id) => {
            if (players[id]) {
                delete players[id];
                updatePlayerCount();
                addLog(`플레이어(${id.slice(0, 6)})가 나갔습니다.`, 'disconnect');
            }
        });

        function updatePlayerCount() {
            playerCount.innerText = Object.keys(players).length;
        }

        // 게임 메인 루프 (초당 60프레임)
        let lastTime = performance.now();

        function gameLoop(now) {
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            if (!myId || !players[myId]) return;

            const me = players[myId];
            let vx = 0;
            let vy = 0;

            if (keys.KeyW || keys.ArrowUp) vy -= 1;
            if (keys.KeyS || keys.ArrowDown) vy += 1;
            if (keys.KeyA || keys.ArrowLeft) vx -= 1;
            if (keys.KeyD || keys.ArrowRight) vx += 1;

            // 대각선 이동 정규화
            if (vx !== 0 && vy !== 0) {
                vx *= 0.7071;
                vy *= 0.7071;
            }

            if (vx !== 0 || vy !== 0) {
                me.x += vx * speed * dt;
                me.y += vy * speed * dt;

                // 캔버스 벽 충돌 제한
                me.x = Math.max(20, Math.min(canvas.width - 20, me.x));
                me.y = Math.max(20, Math.min(canvas.height - 20, me.y));

                // 서버로 내 이동 좌표 전송
                socket.emit('playerMovement', { x: me.x, y: me.y });
            }

            myCoord.innerText = `내 좌표: (${Math.round(me.x)}, ${Math.round(me.y)})`;
        }

        function render() {
            // 캔버스 초기화
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 격자 배경 그리기
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 모든 플레이어 렌더링
            for (const id in players) {
                const p = players[id];
                const isMe = (id === myId);

                ctx.save();
                ctx.translate(p.x, p.y);

                // 본인 캐릭터인 경우 외곽에 빛나는 오라 효과
                if (isMe) {
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, 24, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // 캐릭터 원체
                ctx.fillStyle = p.color || '#38bdf8';
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 닉네임 / ID 표시
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Pretendard, sans-serif';
                ctx.textAlign = 'center';
                const label = isMe ? '👑 나 (YOU)' : `👤 ${p.id.slice(0, 5)}`;
                ctx.fillText(label, 0, -28);

                ctx.restore();
            }
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
